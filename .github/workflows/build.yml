name: Build Folio
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which build to run
        type: choice
        options: [android, windows, both]
        default: android
  push:
    tags: ['v*']

jobs:
  windows:
    if: ${{ github.event_name == 'push' || inputs.target == 'windows' || inputs.target == 'both' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: folio-windows
          path: release/*.exe

  android:
    if: ${{ github.event_name == 'push' || inputs.target != 'windows' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Android icons
        run: |
          if [ -f assets/icon-only.png ]; then npx --yes @capacitor/assets generate --android --iconBackgroundColor '#f7f6f3' --iconBackgroundColorDark '#161615'; fi
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: folio-android
          path: android/app/build/outputs/apk/debug/*.apk
