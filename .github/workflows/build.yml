name: Build Folio
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which build to run
        type: choice
        options: [android, windows, both]
        default: android
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    if: ${{ github.event_name == 'push' || inputs.target == 'windows' || inputs.target == 'both' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: folio-windows
          path: release/*.exe

  android:
    if: ${{ github.event_name == 'push' || inputs.target != 'windows' }}
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Signing secrets are missing. Set ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see README)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Android icons
        run: |
          if [ -f assets/icon-only.png ]; then npx --yes @capacitor/assets generate --android --iconBackgroundColor '#f7f6f3' --iconBackgroundColorDark '#161615'; fi
      - name: Set app version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Build release APK and bundle
        run: ./gradlew assembleRelease bundleRelease
        working-directory: android
      - name: Sign
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*-unsigned.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist-android
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out dist-android/Folio-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs dist-android/Folio-release.apk
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          cp "$AAB" dist-android/Folio-release.aab
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass:env KS_PASS -keypass:env KEY_PASS dist-android/Folio-release.aab "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: folio-android
          path: dist-android/*

  release:
    if: ${{ github.event_name == 'push' }}
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/folio-android/Folio-release.apk
            artifacts/folio-windows/*.exe
          generate_release_notes: true
